  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const $$ = (sel, root) => Array.from((root || $("cour-svg")).querySelectorAll(sel));

      // Split each text line into word spans for word-by-word entrances.
      function split(el) {
        Array.from(el.childNodes).forEach((n) => {
          if (n.nodeType === 3) {
            const frag = document.createDocumentFragment();
            n.textContent.split(/( +)/).forEach((p) => {
              if (!p) return;
              if (/^ +$/.test(p)) return frag.append(" ");
              const s = document.createElement("span");
              s.className = "w";
              s.style.display = "inline-block";
              s.textContent = p;
              frag.append(s);
            });
            n.replaceWith(frag);
          } else if (n.nodeType === 1 && !n.classList.contains("num") && !n.classList.contains("cour-banner")) {
            split(n);
          }
        });
      }
      const lineIds = ["cour-hook-q", "cour-l1", "cour-l1b", "cour-l2", "cour-l3", "cour-l3b", "cour-l4", "cour-l5", "cour-l6"];
      lineIds.forEach((id) => split($(id)));
      const words = (id) => Array.from($(id).querySelectorAll(".w, .num"));

      const tl = gsap.timeline({ paused: true });

      function wordsIn(id, t) {
        tl.fromTo(words(id), { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, stagger: 0.07, ease: "power2.out" }, t);
      }
      function wordsOut(id, t) {
        tl.to(words(id), { opacity: 0, filter: "blur(8px)", duration: 0.18, stagger: 0.015, ease: "power2.in" }, t);
      }
      // Hidden before their entrance.
      lineIds.slice(2).forEach((id) => gsap.set(words(id), { opacity: 0 }));
      gsap.set(words("cour-l1"), { opacity: 0 });

      // ---------- Texte ----------
      // 0 — hook (visible at frame 0)
      tl.to("#cour-hook-ey", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 5.0);
      wordsOut("cour-hook-q", 5.0);
      // 1 — bitume
      wordsIn("cour-l1", 5.5);
      wordsIn("cour-l1b", 7.0);
      wordsOut("cour-l1", 10.2);
      wordsOut("cour-l1b", 10.2);
      // 2 — pluie
      wordsIn("cour-l2", 10.6);
      wordsOut("cour-l2", 14.3);
      // 3 — bascule
      wordsIn("cour-l3", 14.6);
      wordsIn("cour-l3b", 15.0);
      wordsOut("cour-l3", 17.4);
      wordsOut("cour-l3b", 17.4);
      // 4, 5, 6 — étapes
      wordsIn("cour-l4", 17.7);
      wordsOut("cour-l4", 20.9);
      wordsIn("cour-l5", 21.2);
      wordsOut("cour-l5", 24.4);
      wordsIn("cour-l6", 24.7);

      // ---------- Illustration ----------
      // Soleil : rotation lente et constante
      tl.fromTo("#cour-rays", { rotation: 0, svgOrigin: "560 90" }, { rotation: 60, svgOrigin: "560 90", duration: 27.5, ease: "none" }, 0);

      // Vagues de chaleur : montent en boucle finie jusqu'à la fraîcheur
      $$(".cour-wave").forEach((w, i) => {
        tl.fromTo(w, { y: 0, opacity: 0.9 }, { y: -36, opacity: 0.15, duration: 1.2, ease: "sine.out", repeat: 19, delay: 0 }, i * 0.4);
      });
      tl.to("#cour-heat", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 24.7);

      // Thermomètre : chaud, puis brûlant, puis frais
      gsap.set("#cour-thermo-fill", { scaleY: 0.45, transformOrigin: "50% 100%" });
      gsap.set(["#cour-thermo-hot", "#cour-thermo-cool"], { opacity: 0 });
      tl.to("#cour-thermo-fill", { scaleY: 1, duration: 1.6, ease: "power2.inOut" }, 7.0);
      tl.fromTo("#cour-thermo-hot", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, 8.0);
      tl.to("#cour-thermo-hot", { opacity: 0, duration: 0.2 }, 24.7);
      tl.to("#cour-thermo-fill", { scaleY: 0.3, fill: "#3a8c3f", duration: 1.2, ease: "power2.inOut" }, 24.9);
      tl.to("#cour-thermo-bulb", { fill: "#3a8c3f", duration: 1.2, ease: "power2.inOut" }, 24.9);
      tl.fromTo("#cour-thermo-cool", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, 25.6);

      // Pluie qui ruisselle sur le bitume
      gsap.set(["#cour-rainA", "#cour-rainB", "#cour-lbl-runoff", "#cour-lbl-infil", "#cour-runoff-head"], { opacity: 0 });
      gsap.set("#cour-runoff", { strokeDasharray: 600, strokeDashoffset: 600 });
      tl.set("#cour-rainA", { opacity: 1 }, 10.8);
      $$("#cour-rainA line").forEach((d, i) => {
        tl.fromTo(d, { y: 0 }, { y: 220, duration: 0.55, ease: "power1.in", repeat: 5 }, 10.8 + i * 0.09);
      });
      tl.set("#cour-rainA", { opacity: 0 }, 14.3);
      tl.to("#cour-runoff", { strokeDashoffset: 0, duration: 1.0, ease: "power2.inOut" }, 11.4);
      tl.to("#cour-runoff-head", { opacity: 1, duration: 0.15 }, 12.3);
      tl.fromTo("#cour-lbl-runoff", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, 12.0);
      tl.to(["#cour-runoff", "#cour-runoff-head", "#cour-lbl-runoff"], { opacity: 0, duration: 0.3 }, 14.3);

      // Étape 1 : le bitume disparaît, l'herbe pousse, l'eau s'infiltre
      tl.to("#cour-lbl-bitume", { opacity: 0, duration: 0.2 }, 17.6);
      tl.to($$(".cour-seg"), { scaleY: 0, transformOrigin: "50% 100%", opacity: 0, duration: 0.35, stagger: 0.12, ease: "power3.in" }, 17.7);
      tl.fromTo("#cour-tufts", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.6, ease: "back.out(1.6)" }, 18.4);
      tl.set("#cour-rainB", { opacity: 1 }, 18.6);
      $$("#cour-rainB line").forEach((d, i) => {
        tl.fromTo(d, { y: 0 }, { y: 250, duration: 0.6, ease: "power1.in", repeat: 3 }, 18.6 + i * 0.09);
      });
      tl.set("#cour-rainB", { opacity: 0 }, 21.1);
      $$(".cour-flow").forEach((f) => gsap.set(f, { strokeDasharray: 140, strokeDashoffset: 140 }));
      tl.to($$(".cour-flow"), { strokeDashoffset: 0, duration: 0.9, stagger: 0.15, ease: "power2.out" }, 19.0);
      tl.fromTo("#cour-lbl-infil", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, 19.4);
      tl.to(["#cour-lbl-infil"], { opacity: 0, duration: 0.25 }, 21.0);

      // Étape 2 : les arbres poussent, l'ombre apparaît, les racines descendent
      ["#cour-tree1", "#cour-tree2"].forEach((t, i) => {
        const trunk = document.querySelector(t + " .cour-trunk");
        const crown = document.querySelector(t + " .cour-crown");
        tl.fromTo(trunk, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.6, ease: "power3.out" }, 21.4 + i * 0.3);
        tl.fromTo(crown, { scale: 0, transformOrigin: "50% 80%" }, { scale: 1, duration: 0.8, ease: "back.out(1.5)" }, 21.8 + i * 0.3);
      });
      tl.to(["#cour-shade1", "#cour-shade2"], { opacity: 0.22, duration: 0.6, stagger: 0.3 }, 22.3);
      $$(".cour-root").forEach((r) => gsap.set(r, { strokeDasharray: 260, strokeDashoffset: 260 }));
      tl.to($$(".cour-root"), { strokeDashoffset: 0, duration: 1.0, stagger: 0.3, ease: "power2.out" }, 21.6);

      // Étape 3 : bancs et fleurs
