  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // Colour flood: the violet ground rises over the courtyard.
      tl.fromTo("#ep-ground", { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power2.inOut" }, 0);
      tl.fromTo("#ep-logo-card", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 0.35);
      tl.fromTo("#ep-eyebrow", { opacity: 0, x: -40, filter: "blur(8px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, 0.45);
      tl.fromTo("#ep-title", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 0.8);

      document.querySelectorAll("#ep-leaves .ep-stem").forEach((p) => gsap.set(p, { strokeDasharray: 340, strokeDashoffset: 340 }));
      tl.to("#ep-leaves .ep-stem", { strokeDashoffset: 0, duration: 1.0, stagger: 0.2, ease: "power2.out" }, 0.6);
      tl.fromTo("#ep-leaves .ep-leaf", { scale: 0, transformOrigin: "50% 100%" }, { scale: 1, duration: 0.5, stagger: 0.12, ease: "back.out(1.6)" }, 1.2);

      // Stats, one per beat.
      const rows = ["#ep-r1", "#ep-r2", "#ep-r3", "#ep-r4"];
      rows.forEach((r, i) => {
        const t = 1.8 + i * 1.3;
        tl.fromTo(r + " .ep-num", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, t);
        tl.fromTo(r + " .ep-txt", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, t + 0.15);
        tl.fromTo(r, { borderTopColor: "rgba(237,230,247,0)" }, { borderTopColor: "rgba(237,230,247,0.25)", duration: 0.4 }, t);
      });
      // 159 500 counts up as it lands.
      const counter = { v: 0 };
      const el = document.getElementById("ep-count");
      tl.fromTo(counter, { v: 0 }, {
        v: 159500, duration: 1.0, ease: "power2.out",
        onUpdate: () => { el.textContent = String(Math.round(counter.v / 100) * 100).replace(/\B(?=(\d{3})+(?!\d))/g, " "); },
      }, 3.1);

      // The stamp: everything dims, the verdict lands.
      tl.to(["#ep-stats", "#ep-head"], { opacity: 0.18, filter: "blur(4px)", duration: 0.4, ease: "power2.inOut" }, 7.6);
      tl.fromTo("#ep-band1", { opacity: 0, scale: 1.25, rotation: -4 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.35, ease: "back.out(1.6)" }, 7.9);
      tl.fromTo("#ep-band2", { opacity: 0, scale: 1.4, rotation: -4 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.35, ease: "back.out(1.8)" }, 9.0);
      tl.to("#ep-stamp", { opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power2.in" }, 12.1);

      window.__timelines["epinay"] = tl;
    })();
