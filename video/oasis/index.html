<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #fafaf8;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="47"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="cour"
        class="clip"
        data-composition-id="cour"
        data-composition-src="compositions/cour.html"
        data-start="0"
        data-duration="27.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 1"
      ></div>
      <div
        id="epinay"
        class="clip"
        data-composition-id="epinay"
        data-composition-src="compositions/epinay.html"
        data-start="27"
        data-duration="12.5"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2"
      ></div>
      <div
        id="fin"
        class="clip"
        data-composition-id="fin"
        data-composition-src="compositions/fin.html"
        data-start="39"
        data-duration="8"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
