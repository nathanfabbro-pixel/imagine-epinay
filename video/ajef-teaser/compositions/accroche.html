<template>
  <style>
    @font-face { font-family: "Unbounded"; font-weight: 600; src: url("assets/fonts/unbounded-latin-600-normal.woff2") format("woff2"); }
    @font-face { font-family: "Unbounded"; font-weight: 800; src: url("assets/fonts/unbounded-latin-800-normal.woff2") format("woff2"); }
    @font-face { font-family: "Unbounded"; font-weight: 900; src: url("assets/fonts/unbounded-latin-900-normal.woff2") format("woff2"); }
    @font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; src: url("assets/fonts/instrument-serif-latin-400-italic.woff2") format("woff2"); }
    @font-face { font-family: "Instrument Sans"; font-weight: 500; src: url("assets/fonts/instrument-sans-latin-500-normal.woff2") format("woff2"); }
    @font-face { font-family: "Instrument Sans"; font-weight: 600; src: url("assets/fonts/instrument-sans-latin-600-normal.woff2") format("woff2"); }
    @font-face { font-family: "Instrument Sans"; font-weight: 700; src: url("assets/fonts/instrument-sans-latin-700-normal.woff2") format("woff2"); }
    #root {
      position: absolute;

    #ac-flash-b {
      left: -500px;

      background: radial-gradient(circle, #3d6bff 0%, rgba(61, 107, 255, 0) 60%);
    }
    #ac-title {
      position: absolute;
      left: 72px;

    #ac-bienvenue {
      font-family: "Unbounded", sans-serif;

      font-family: "Instrument Serif", serif;

    #ac-ajef .l {
      display: inline-block;

  </style>
  <div id="root" data-composition-id="accroche" data-width="1080" data-height="1920">
    <div id="ac-flash-b" class="ac-flash" data-layout-ignore></div>
    <div id="ac-flash-r" class="ac-flash" data-layout-ignore></div>

    <div id="ac-title" data-layout-allow-overflow>
      <div id="ac-bienvenue">BIENVENUE</div>
      <div id="ac-ajef"><span class="l">à</span> <span class="l">l'</span><span class="l">A</span><span class="l">J</span><span class="l">E</span><span class="l">F</span><span id="ac-bang">&nbsp;!</span></div>
      <div id="ac-sub">
        <div id="ac-sub-caps">Journée d'accueil</div>
        <div id="ac-sub-it">des jeunes élus de France</div>
      </div>
    </div>

    <div id="ac-verbs">
      <div id="ac-v1" class="ac-verb">Se rencontrer.</div>
      <div id="ac-v2" class="ac-verb">Échanger.</div>
      <div id="ac-v3" class="ac-verb">S'engager.</div>
    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const letters = Array.from(document.querySelectorAll("#ac-ajef .l"));

      // « BIENVENUE » is on screen from frame 0; « à l'AJEF » writes itself in.
      tl.fromTo(letters, { opacity: 0, y: 40, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.35, stagger: 0.06, ease: "expo.out" }, 0.2);
      tl.fromTo("#ac-bang", { opacity: 0, scale: 0.2, rotation: -20 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.2)" }, 0.75);
      tl.fromTo("#ac-sub-caps", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 1.2);
      tl.fromTo("#ac-sub-it", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 1.4);

      // Carry across: the title rises and shrinks to make room for the promise.
      tl.to("#ac-sub", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 2.85);
      tl.to("#ac-title", { y: -230, scale: 0.62, transformOrigin: "0% 0%", duration: 0.6, ease: "power3.inOut" }, 2.9);

      // Three verbs, one per beat; each lands with a halo, the previous dims.
      const verbs = ["#ac-v1", "#ac-v2", "#ac-v3"];
      const flashes = ["#ac-flash-r", "#ac-flash-b", "#ac-flash-r"];
      gsap.set(verbs, { opacity: 0 });
      verbs.forEach((v, i) => {
        const t = 3.35 + i * 0.85;
        tl.fromTo(v, { opacity: 0, x: 120, filter: "blur(12px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, t);
        tl.fromTo(flashes[i], { opacity: 0 }, { opacity: 0.55, duration: 0.25, ease: "power2.out" }, t);
        tl.to(flashes[i], { opacity: 0, duration: 0.6, ease: "power2.inOut" }, t + 0.35);
        if (i > 0) tl.to(verbs[i - 1], { opacity: 0.38, duration: 0.3, ease: "power2.out" }, t);
      });

      // Leave clean.
      tl.to(["#ac-title", "#ac-verbs"], { opacity: 0, y: "-=60", filter: "blur(10px)", duration: 0.3, ease: "power3.in" }, 5.85);
      window.__timelines["accroche"] = tl;
    })();
  </script>
