  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const letters = Array.from(document.querySelectorAll("#ac-ajef .l"));

      // Frame 0: « BIENVENUE » fills the screen, then slams down into place.
      tl.fromTo("#ac-bienvenue", { scale: 1.75, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.42, ease: "expo.out" }, 0);
      // Impact: a white flash, both halos fire, the tricolour streaks whip across.
      tl.fromTo("#ac-white", { opacity: 0 }, { opacity: 0.38, duration: 0.05, ease: "none" }, 0.12);
      tl.to("#ac-white", { opacity: 0, duration: 0.3, ease: "power2.out" }, 0.17);
      tl.fromTo(["#ac-flash-b", "#ac-flash-r"], { opacity: 0 }, { opacity: 0.7, duration: 0.15, ease: "power2.out" }, 0.12);
      tl.to(["#ac-flash-b", "#ac-flash-r"], { opacity: 0, duration: 0.9, ease: "power2.inOut" }, 0.3);
      ["#ac-s1", "#ac-s2", "#ac-s3"].forEach((s, i) => {
        tl.fromTo(s, { x: -1700 }, { x: 1700, duration: 0.55, ease: "power3.inOut" }, 0.1 + i * 0.07);
      });

      // « à l'AJEF » drops in letter by letter, the « ! » lands with a ring.
      tl.fromTo(letters, { opacity: 0, y: -120, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, stagger: 0.05, ease: "back.out(1.6)" }, 0.4);
      tl.fromTo("#ac-bang", { opacity: 0, scale: 0.2, rotation: -25 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.6)" }, 0.85);
      tl.fromTo("#ac-ring", { opacity: 1, scale: 0.3 }, { opacity: 0, scale: 3, duration: 0.6, ease: "power2.out" }, 0.95);
      // A small punch-in of the whole title on the « ! ».
      tl.fromTo("#ac-title", { scale: 1 }, { scale: 1.05, duration: 0.08, ease: "power2.out", transformOrigin: "50% 40%" }, 0.95);
      tl.to("#ac-title", { scale: 1, duration: 0.35, ease: "power3.out" }, 1.03);

      tl.fromTo("#ac-sub-caps", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 1.1);
      tl.fromTo("#ac-sub-it", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 1.2);

      // Carry across: the title rises and shrinks to make room for the promise.
      tl.to("#ac-sub", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 2.6);
      tl.to("#ac-title", { y: -260, scale: 0.62, transformOrigin: "50% 0%", duration: 0.55, ease: "power3.inOut" }, 2.65);

      // Three verbs slam in, one per beat; each lands with a halo, the previous dims.
      const verbs = ["#ac-v1", "#ac-v2", "#ac-v3"];
      const flashes = ["#ac-flash-r", "#ac-flash-b", "#ac-flash-r"];
      gsap.set(verbs, { opacity: 0 });
      verbs.forEach((v, i) => {
        const t = 3.05 + i * 0.6;
        tl.fromTo(v, { opacity: 0, scale: 1.6, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "expo.out" }, t);
        tl.fromTo(flashes[i], { opacity: 0 }, { opacity: 0.55, duration: 0.2, ease: "power2.out" }, t);
        tl.to(flashes[i], { opacity: 0, duration: 0.5, ease: "power2.inOut" }, t + 0.3);
        if (i > 0) tl.to(verbs[i - 1], { opacity: 0.38, duration: 0.3, ease: "power2.out" }, t);
      });

      // Leave clean.
      tl.to(["#ac-title", "#ac-verbs"], { opacity: 0, y: "-=60", filter: "blur(10px)", duration: 0.3, ease: "power3.in" }, 4.9);
      window.__timelines["accroche"] = tl;
    })();
