<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #1a2c6e;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <div id="fond" class="clip" data-composition-id="fond" data-composition-src="compositions/fond.html"
        data-start="0" data-duration="30" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="accroche" class="clip" data-composition-id="accroche" data-composition-src="compositions/accroche.html"
        data-start="0" data-duration="5.2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="infos" class="clip" data-composition-id="infos" data-composition-src="compositions/infos.html"
        data-start="5" data-duration="3.9" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="programme" class="clip" data-composition-id="programme" data-composition-src="compositions/programme.html"
        data-start="8.8" data-duration="8.4" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 4"></div>
      <div id="soiree" class="clip" data-composition-id="soiree" data-composition-src="compositions/soiree.html"
        data-start="17" data-duration="5.7" data-track-index="4" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 5"></div>
      <div id="fin" class="clip" data-composition-id="fin" data-composition-src="compositions/fin.html"
        data-start="22.5" data-duration="7.5" data-track-index="5" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 6"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
